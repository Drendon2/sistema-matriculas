{% extends "matriculas/base.html" %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<a href="{% url url_lista %}" class="volver">&larr; Volver al listado</a>
<h2>{{ titulo }}</h2>

<form method="post" class="form-card">
  {% csrf_token %}
  {% for field in form %}
    <div class="field">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<div class="errorlist" style="color:var(--danger);font-size:0.82rem;">{{ field.errors }}</div>{% endif %}
    </div>
  {% endfor %}
  <button type="submit" class="btn">Guardar</button>
</form>
{% endblock %}
