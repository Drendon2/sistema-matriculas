{% extends "matriculas/base.html" %}

{% block title %}Eliminar{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;">
  <h2>¿Eliminar «{{ object }}»?</h2>
  <p class="campo-info" style="margin-top:-0.6rem;">Esta acción no se puede deshacer.</p>

  <form method="post" style="display:flex;gap:0.6rem;">
    {% csrf_token %}
    <button type="submit" class="btn btn-retirar">Sí, eliminar</button>
    <a href="{% url url_lista %}" class="btn btn-secundario">Cancelar</a>
  </form>
</div>
{% endblock %}
